const t=document.getElementById("t");let i=0,timer=null,paused=false,t0=0,base=0;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function paint(line){let c="";if(line.startsWith("\u2501"))c="s";else if(/BLOCK/.test(line))c="b";else if(/ALLOW|found=True/.test(line))c="p";else if(/^\s*\(|reserves a/.test(line))c="d";
 t.innerHTML+=(c?'<span class="'+c+'">'+esc(line)+'</span>':esc(line))}
function step(){if(paused)return;const sp=parseFloat(document.getElementById("spd").value);
 if(i>=EV.length)return;const wait=Math.max(0,(EV[i][0]-base)/sp);
 timer=setTimeout(()=>{paint(EV[i][1].replace(/\r/g,""));i++;window.scrollTo(0,document.body.scrollHeight);step()},wait);
 base=EV[i][0]}
function start(){clearTimeout(timer);t.innerHTML="";i=0;base=0;paused=false;document.getElementById("pause").textContent="Pause";step()}
